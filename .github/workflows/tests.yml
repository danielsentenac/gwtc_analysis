name: Tests

# The unit tests of the package, without those that need the network (pytest marker "network").
on:
  push:
    branches: [main]
    paths:
      - "gwtc_analysis/**"
      - "tests/**"
      - "galaxy/**"
      - "docs/modes/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gwtc
          cache-environment: true
          # the run requirements of conda-recipe/meta.yaml, with the versions the tests pass with on the clusters
          create-args: >-
            python=3.11
            numpy<2
            scipy
            pandas
            matplotlib
            astropy
            h5py
            healpy
            requests
            tqdm
            pyyaml
            gwpy
            gwosc
            ligo.skymap
            pesummary>=1.8
            pycbc
            pyseobnr
            minio
            lalsuite
            astropy-healpix
            reproject
            fsspec
            aiohttp
            bilby
            dynesty
            emcee
            setuptools<81
            pytest
          condarc: |
            channels:
              - conda-forge
      - name: Install the package
        run: pip install --no-deps -e .
      - name: Run the tests
        run: python -m pytest -q -m "not network" -p no:cacheprovider
